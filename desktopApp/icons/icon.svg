<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Hex Editor icon: a "0x" monogram. The text needs JetBrains Mono at render time; icons/render.sh supplies it. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A86F7"/>
      <stop offset="1" stop-color="#2652C9"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#g)"/>
  <text x="512" y="600" font-family="JetBrains Mono, monospace" font-size="330" font-weight="800" fill="#FFFFFF"
        text-anchor="middle" letter-spacing="-10">0x</text>
  <rect x="300" y="700" width="424" height="28" rx="14" fill="#FFFFFF" opacity="0.35"/>
</svg>
