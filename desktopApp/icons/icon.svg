<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Hex Editor icon: byte cells, a template field (blue row, "48 45 58" = "HEX") and the cursor (amber).
       Text is outlined by the font at render time: rasterize with JetBrains Mono installed or via icons/render.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2F3A"/>
      <stop offset="1" stop-color="#16181D"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A8FF7"/>
      <stop offset="1" stop-color="#3574F0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2B850"/>
      <stop offset="1" stop-color="#E0A030"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#3A4150" stroke-width="3"/>
  <g>
    <rect x="232" y="232" width="160" height="160" rx="40" fill="url(#blue)"/>
    <rect x="432" y="232" width="160" height="160" rx="40" fill="url(#blue)"/>
    <rect x="632" y="232" width="160" height="160" rx="40" fill="url(#blue)"/>
    <rect x="232" y="432" width="160" height="160" rx="40" fill="#3A4150"/>
    <rect x="432" y="432" width="160" height="160" rx="40" fill="url(#amber)"/>
    <rect x="632" y="432" width="160" height="160" rx="40" fill="#3A4150"/>
    <rect x="232" y="632" width="160" height="160" rx="40" fill="#3A4150"/>
    <rect x="432" y="632" width="160" height="160" rx="40" fill="#3A4150"/>
    <rect x="632" y="632" width="160" height="160" rx="40" fill="#2E333C"/>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="92" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <text x="312" y="345">48</text>
    <text x="512" y="345">45</text>
    <text x="712" y="345">58</text>
  </g>
</svg>
